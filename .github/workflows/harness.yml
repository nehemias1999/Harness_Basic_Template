# El arnés, verificándose a sí mismo.
#
# Existe por una razón que el propio repositorio predica: un control que
# depende de que alguien se acuerde de ejecutarlo no es un control. Hasta este
# workflow, los tests del arnés no los corría nada automáticamente y la
# paridad entre init.ps1 e init.sh dependía de que alguien la mirara a mano.
#
# Los dos verificadores son el mismo en dos dialectos, así que corren los dos:
# si divergen, es acá donde se ve.
name: arnés

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX (init.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests del arnés
        run: python -m unittest discover -s scripts/tests -v

      - name: Verificador
        # La plantilla sin instanciar sale en rojo A PROPÓSITO: su sección 3
        # exige configurar el proyecto primero. Lo que se comprueba acá es que
        # falle por esa razón y no por otra, y que las secciones que no
        # dependen de la instanciación estén en verde.
        run: |
          set +e
          salida=$(./init.sh --quiet 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          echo "exit code: $codigo"

          if [ "$codigo" -ne 1 ]; then
            echo "::error::se esperaba exit 1 (plantilla sin instanciar), llegó $codigo"
            exit 1
          fi
          echo "$salida" | grep -q "SIN INSTANCIAR" || {
            echo "::error::el verificador falla, pero no por estar sin instanciar"
            exit 1
          }
          for seccion in "feature_list.json válido" "requisitos ("; do
            echo "$salida" | grep -q "$seccion" || {
              echo "::error::falta la línea [OK] de: $seccion"
              exit 1
            }
          done

      - name: Los validadores, por separado
        run: |
          python scripts/validate_feature_list.py feature_list.json
          python scripts/validate_requirements.py .

      - name: Los hooks bloquean
        # Si esto deja de salir 2, los hooks vuelven a ser decorativos y nadie
        # se entera hasta que una sesión cierre con el verificador en rojo.
        run: |
          set +e
          echo '{}' | python scripts/harness_hook.py stop
          codigo=$?
          set -e
          [ "$codigo" -eq 2 ] || { echo "::error::el hook stop debería bloquear con 2, salió $codigo"; exit 1; }

          set +e
          echo '{"tool_name":"Write","tool_input":{"file_path":"scripts/validate_requirements.py"}}' \
            | python scripts/harness_hook.py pre-tool-use
          codigo=$?
          set -e
          [ "$codigo" -eq 2 ] || { echo "::error::pre-tool-use debería bloquear con 2, salió $codigo"; exit 1; }

  windows:
    name: Windows (init.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests del arnés
        run: python -m unittest discover -s scripts/tests -v

      - name: Verificador
        shell: pwsh
        run: |
          $salida = & ./init.ps1 -Quiet 6>&1 | Out-String
          $codigo = $LASTEXITCODE
          Write-Host $salida
          Write-Host "exit code: $codigo"

          if ($codigo -ne 1) {
            Write-Host "::error::se esperaba exit 1 (plantilla sin instanciar), llegó $codigo"
            exit 1
          }
          if ($salida -notmatch "SIN INSTANCIAR") {
            Write-Host "::error::el verificador falla, pero no por estar sin instanciar"
            exit 1
          }

          # El paso hereda el $LASTEXITCODE del verificador, que sale con 1 a
          # propósito. Sin esto, el job falla aunque las comprobaciones pasen.
          exit 0

  paridad:
    name: Paridad de las secciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Las cabeceras de init.ps1 e init.sh coinciden
        # docs/scripts.md dice "si cambias uno, cambia el otro". Esto lo
        # convierte en algo comprobable en vez de una buena intención.
        run: |
          python - <<'PY'
          import re, sys

          def secciones(path, patron):
              with open(path, encoding="utf-8") as handle:
                  return [m.group(1).strip() for m in re.finditer(patron, handle.read())]

          ps1 = secciones("init.ps1", r'Write-Host "-- (\d+\. [^-]+?) -+"')
          sh = secciones("init.sh", r'echo "── (\d+\. [^─]+?) ─+"')

          if ps1 != sh:
              print("::error::init.ps1 e init.sh no tienen las mismas secciones")
              print(f"  init.ps1: {ps1}")
              print(f"  init.sh : {sh}")
              sys.exit(1)
          print(f"{len(ps1)} secciones, idénticas en las dos plataformas:")
          for nombre in ps1:
              print(f"  {nombre}")
          PY
