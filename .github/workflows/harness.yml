# The harness, verifying itself.
#
# It exists for a reason the repository itself preaches: a control that depends
# on somebody remembering to run it is not a control. Until this workflow, the
# harness's own tests were not run by anything automatically and the parity
# between init.ps1 and init.sh depended on someone eyeballing it.
#
# The two verifiers are the same one in two dialects, so both run: if they
# diverge, this is where it shows.
name: harness

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX (init.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Harness tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Verifier
        # The uninstantiated template comes out red ON PURPOSE: its section 3
        # demands configuring the project first. What is checked here is that
        # it fails for that reason and not another, and that the sections that
        # do not depend on instantiation are green.
        run: |
          set +e
          output=$(./init.sh --quiet 2>&1)
          code=$?
          set -e
          echo "$output"
          echo "exit code: $code"

          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (uninstantiated template), got $code"
            exit 1
          fi
          echo "$output" | grep -q "NOT INSTANTIATED" || {
            echo "::error::the verifier fails, but not because it is uninstantiated"
            exit 1
          }
          for section in "feature_list.json valid" "requirements ("; do
            echo "$output" | grep -q "$section" || {
              echo "::error::missing the [OK] line for: $section"
              exit 1
            }
          done

      - name: The validators, separately
        run: |
          python scripts/validate_feature_list.py feature_list.json
          python scripts/validate_requirements.py .

      - name: No dangling references
        # CHECKPOINTS.md C1 has always asked for this; until recently nobody
        # checked it. The verifier does not run it on purpose: a broken
        # reference is documentation debt, not a reason to stop a working
        # session.
        run: python scripts/validate_references.py .

      - name: The hooks block
        # If this stops exiting 2, the hooks go back to being decorative and
        # nobody notices until a session closes with the verifier red.
        run: |
          set +e
          echo '{}' | python scripts/harness_hook.py stop
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::the stop hook should block with 2, it exited $code"; exit 1; }

          set +e
          echo '{"tool_name":"Write","tool_input":{"file_path":"scripts/validate_requirements.py"}}' \
            | python scripts/harness_hook.py pre-tool-use
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::pre-tool-use should block with 2, it exited $code"; exit 1; }

  windows:
    name: Windows (init.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Harness tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Verifier
        shell: pwsh
        run: |
          $output = & ./init.ps1 -Quiet 6>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          Write-Host "exit code: $code"

          if ($code -ne 1) {
            Write-Host "::error::expected exit 1 (uninstantiated template), got $code"
            exit 1
          }
          if ($output -notmatch "NOT INSTANTIATED") {
            Write-Host "::error::the verifier fails, but not because it is uninstantiated"
            exit 1
          }

          # The step inherits the verifier's $LASTEXITCODE, which is 1 on
          # purpose. Without this, the job fails even when the checks pass.
          exit 0

  parity:
    name: Section parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: init.ps1 and init.sh headers match
        # docs/scripts.md says "if you change one, change the other". This
        # turns that into something checkable instead of a good intention.
        run: |
          python - <<'PY'
          import re, sys

          def sections(path, pattern):
              with open(path, encoding="utf-8") as handle:
                  return [m.group(1).strip() for m in re.finditer(pattern, handle.read())]

          ps1 = sections("init.ps1", r'Write-Host "-- (\d+\. [^-]+?) -+"')
          sh = sections("init.sh", r'echo "── (\d+\. [^─]+?) ─+"')

          if ps1 != sh:
              print("::error::init.ps1 and init.sh do not declare the same sections")
              print(f"  init.ps1: {ps1}")
              print(f"  init.sh : {sh}")
              sys.exit(1)
          print(f"{len(ps1)} sections, identical on both platforms:")
          for name in ps1:
              print(f"  {name}")
          PY
